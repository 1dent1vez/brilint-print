name = "brilint-print"
compatibility_date = "2026-01-01"
pages_build_output_dir = "site"

# D1: cola de trabajos. Crea la base con:
#   npx wrangler d1 create brilint-print
# y pega aquí el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "brilint-print"
database_id = "b7916c24-0454-41ec-b5bf-f8509ee6eed0"

# Archivos subidos: KV (no requiere método de pago; 25 MB por archivo).
#   npx wrangler kv namespace create brilint-print-files
[[kv_namespaces]]
binding = "BUCKET"
id = "16bbadaccffc450e8d017c6f2e741823"

# Workers AI: interpreta las notas libres del cliente (sin API key externa).
[ai]
binding = "AI"

# El token del agente NO va aquí: se guarda como secreto.
#   npx wrangler pages secret put AGENT_TOKEN --project-name brilint-print
